services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/18/docker
      # The same tuner the root stack uses, so development runs on settings derived from
      # the Docker VM instead of PostgreSQL's defaults for a machine far smaller than a
      # laptop. All optional; they are documented in the root example.env.
      POSTGRES_MEMORY_LIMIT: ${POSTGRES_MEMORY_LIMIT:-0}
      POSTGRES_CPU_LIMIT: ${POSTGRES_CPU_LIMIT:-0}
      POSTGRES_TUNE_MODE: ${POSTGRES_TUNE_MODE:-}
      POSTGRES_TUNE_PROFILE: ${POSTGRES_TUNE_PROFILE:-}
      POSTGRES_TUNE_STORAGE: ${POSTGRES_TUNE_STORAGE:-}
      POSTGRES_TUNE_DB_SIZE: ${POSTGRES_TUNE_DB_SIZE:-}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-}
      POSTGRES_SHM_SIZE: ${POSTGRES_SHM_SIZE:-${OPENCW_POSTGRES_SHM_SIZE:-2gb}}
      POSTGRES_HOST_MEMORY_SHARE: ${POSTGRES_HOST_MEMORY_SHARE:-50}
      POSTGRES_TUNE_DISABLE: ${POSTGRES_TUNE_DISABLE:-0}
      POSTGRES_TUNE_EXTRA: ${POSTGRES_TUNE_EXTRA:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql
      - type: bind
        source: ../db/tune.sh
        target: /usr/local/bin/opencw-pg-tune.sh
        read_only: true
      - type: bind
        source: ../db/pgtune.sh
        target: /usr/local/bin/pgtune.sh
        read_only: true
    entrypoint: ["/bin/sh", "/usr/local/bin/opencw-pg-tune.sh"]
    command: ["postgres"]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-0}
    cpus: ${POSTGRES_CPU_LIMIT:-0}
    shm_size: ${POSTGRES_SHM_SIZE:-${OPENCW_POSTGRES_SHM_SIZE:-2gb}}
    # Cap the log files, as in the root stack.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    # No healthcheck: the image is distroless, so there is no shell or HTTP client inside it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot renderer: turns the credentials in .env into pgAdmin's server definition and
  # .pgpass, then exits. Runs before pgadmin on every `docker compose up -d`.
  pgadmin-config:
    image: dpage/pgadmin4:9.18.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
    command: ["exec /venv/bin/python3 /usr/local/bin/opencw-pgadmin-config.py"]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../scripts/render-pgadmin.py:/usr/local/bin/opencw-pgadmin-config.py:ro

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      pgadmin-config:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: "True"
      PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test:
        - CMD-SHELL
        - /venv/bin/python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:80/misc/ping')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  pgadmin_data:

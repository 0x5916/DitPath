name: ditpath-ui-acceptance
services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_DB: acceptance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare.py first}
    volumes:
      - ./runtime/postgres:/var/lib/postgresql
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U acceptance -d acceptance]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [isolated]
  backend:
    image: ditpath-ui-acceptance-backend:${SOURCE_REVISION:?}
    build:
      context: ./source/backend
    environment:
      PORT: '8080'
      GIN_MODE: release
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: acceptance
      DB_NAME: acceptance
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      RESEND_API_KEY: acceptance-disabled
      RESEND_FROM_EMAIL: acceptance@example.invalid
      GOOGLE_CLIENT_ID: ''
      AUTH_TRUSTED_PROXY_CIDRS: ''
      CORS_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
    depends_on:
      db: { condition: service_healthy }
    networks: [isolated]
  frontend:
    image: ditpath-ui-acceptance-frontend:${SOURCE_REVISION:?}
    build:
      context: ./source/frontend
      args:
        PUBLIC_API_BASE: /v1
        PUBLIC_GOOGLE_CLIENT_ID: ''
        PRERENDER_ORIGIN: http://127.0.0.1:3001
    volumes:
      - ./runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Docker does not publish ports for an internal-only network. Only nginx
    # joins the access bridge; both loopback ports proxy /v1 to the private API.
    ports: ['127.0.0.1:3001:80', '127.0.0.1:8081:80']
    depends_on: [backend]
    networks: [isolated, access]
  checks:
    profiles: [checks]
    build:
      context: ./source/backend
      target: builder
    environment:
      OPENCW_TEST_DATABASE_DSN: host=db port=5432 user=acceptance password=${POSTGRES_PASSWORD:?} dbname=acceptance sslmode=disable
    command: [go, test, -json, -p, '1', ./...]
    networks: [isolated]
networks:
  access: {}
  isolated:
    internal: true
